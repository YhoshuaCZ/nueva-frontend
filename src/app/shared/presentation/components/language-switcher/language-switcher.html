<mat-button-toggle-group class="language-switcher" [class.dark]="variant() === 'dark'" [value]="currentLang()"
                         hideSingleSelectionIndicator aria-label="Preferred language" name="language">
  @for (language of languages; track language) {
    <mat-button-toggle (click)="useLanguage(language)" [aria-label]="language" [value]="language">
      {{ language.toUpperCase() }}
    </mat-button-toggle>
  }
</mat-button-toggle-group>
